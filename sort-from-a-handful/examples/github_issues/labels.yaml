# A handful of examples per label, written by hand before looking at any
# test data. These texts are fictional. Real items come from
# scikit-learn/scikit-learn issues closed and labelled by the maintainers
# (see items.csv and the README).
bug:
  - "fit() crashes with a segmentation fault when n_jobs=-1 and the matrix has two million rows."
  - "predict gives different results on the same data between version 1.3 and 1.4 with the same random_state."
  - "KMeans hangs forever on a 50k by 400 matrix with init='k-means++'."
  - "Calling .predict() before .fit() raises a confusing AttributeError instead of a clear message."
  - "StandardScaler silently changes dtype to float32 on Windows, which breaks downstream comparisons."
documentation:
  - "The docstring for TfidfVectorizer does not explain what lowercase=False does to the vocabulary."
  - "The user guide has no example of cross_val_predict with groups."
  - "The example images on the roc curve page are missing."
  - "Please document how class_weight='balanced' interacts with sample_weight."
  - "There is no note on installing the latest version with conda on Apple silicon."
question:
  - "Is it possible to use StratifiedKFold with a multi-label target?"
  - "How do I get the feature names out of a pipeline after fitting?"
  - "Which scaler should I use when most of my features are zero?"
  - "Does GridSearchCV keep the fitted estimators from the best fold?"
  - "Can I train on data that does not fit in memory using partial_fit?"
new feature:
  - "Please add predict_proba to OneVsOneClassifier."
  - "Native support for categorical features in HistGradientBoostingClassifier would help a lot."
  - "A parameter to export a fitted pipeline to ONNX would save a lot of hand work."
  - "Can KNNImputer accept a distance metric argument?"
  - "It would be good to have sample_weight support in mutual_info_regression."
